version: '3.9'
services:
  postgres:
    container_name: postgres-dev
    image: postgres:12.12
    restart: always
    environment:
      - POSTGRES_USER=milon27
      - POSTGRES_PASSWORD=myPassWord
      - POSTGRES_DB=my_db
    ports:
      - 5432:5432
    volumes:
      - db_vol:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
      
  api-dev:
    container_name: api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      - postgres
    ports:
      - 2727:2727
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://<user>:<password>@postgres-dev/my_db?schema=public

#volumes(root label)
volumes:
  db_vol: {}
